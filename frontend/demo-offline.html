<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OFFLINE DEMO · Adarsh Boutique Dashboard</title>
<style>
/* ============ Adarsh Boutique design system (matches the public site) ============ */
:root{
  --bg:#f2ede3;--panel:#fffefa;--panel-2:#f8f4ec;--ink:#26201d;--muted:#766c66;
  --maroon:#632c35;--maroon-2:#472029;--gold:#b48c58;--gold-soft:#e8d9c4;
  --line:#e7ded1;--ok:#1a7a3c;--bad:#b3372f;--shadow:0 10px 30px #2a1a1512;
  --serif:Georgia,'Times New Roman',serif;--sans:Arial,Helvetica,sans-serif;
}
[data-theme="dark"]{
  --bg:#1d1817;--panel:#262020;--panel-2:#2d2625;--ink:#f0e9e1;--muted:#b0a396;
  --maroon:#c98a94;--maroon-2:#e0aeb5;--gold:#cfa872;--gold-soft:#4a3d2e;
  --line:#3b322f;--ok:#5cbf85;--bad:#e08a80;--shadow:0 10px 30px #00000042;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--maroon);text-decoration:none}
/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:246px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(178deg,var(--maroon-2),#341b21 130%);color:#f4e9d8;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
[data-theme="dark"] .sidebar{background:linear-gradient(178deg,#33241f,#191312 130%)}
.sb-brand{display:flex;gap:12px;align-items:center;padding:24px 20px 20px;border-bottom:1px solid #ffffff22}
.sb-brand .mark{width:40px;height:40px;flex:none;border:1px solid #d8bd90;border-radius:50%;display:grid;place-items:center;font:italic 22px var(--serif);color:#e8cf9f}
.sb-brand strong{font:400 17px var(--serif);display:block;line-height:1.1}
.sb-brand small{display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:#c9ab84;margin-top:4px}
.nav{padding:14px 10px;display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:#e8d9c6;padding:11px 14px;font-size:13.5px;border-radius:6px;text-align:left;transition:background .18s;position:relative}
.nav button:hover{background:#ffffff14}
.nav button.active{background:#ffffff1f;color:#fff;font-weight:700}
.nav button.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--gold)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sb-foot{margin-top:auto;padding:14px 18px;border-top:1px solid #ffffff22;font-size:11px;color:#cbb492;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sb-foot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- main / topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:13px 26px}
.topbar h2{font:400 19px var(--serif);margin:0;letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--muted);transition:border-color .18s,color .18s}
.icon-btn:hover{color:var(--maroon);border-color:var(--gold)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menu-btn{display:none}
.view{padding:26px;max-width:1200px;width:100%;margin:0 auto;animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ---------- cards & grids ---------- */
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;box-shadow:var(--shadow)}
.stat .k{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:400 34px/1.1 var(--serif);margin-top:8px;letter-spacing:-.02em}
.stat .s{font-size:11px;color:var(--muted);margin-top:6px}
.stat .s b{color:var(--ok);font-weight:700}
.grid-2{display:grid;grid-template-columns:1.35fr .95fr;gap:14px;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-h h3{font:400 15.5px var(--serif);margin:0}
.panel-b{padding:16px 18px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:9px 16px;background:var(--maroon);border:1px solid var(--maroon);color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.05em;border-radius:5px;transition:transform .18s,background .18s}
[data-theme="dark"] .btn{color:#241718}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--maroon)}
.btn.ghost:hover{background:var(--panel-2)}
.btn.danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:32px;padding:5px 12px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
/* ---------- tables ---------- */
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tbody tr{transition:background .15s}
.table tbody tr.rowlink{cursor:pointer}
.table tbody tr.rowlink:hover{background:var(--panel-2)}
.table .sub{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.empty{padding:34px;text-align:center;color:var(--muted);font-size:13px}
/* ---------- badges ---------- */
.badge{display:inline-block;padding:3px 9px;font-size:10px;font-weight:700;letter-spacing:.06em;border-radius:999px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);white-space:nowrap}
.badge.ok{border-color:#1a7a3c44;color:var(--ok)}
.badge.warn{border-color:#b48c5866;color:var(--gold)}
.badge.bad{border-color:#b3372f44;color:var(--bad)}
.badge.info{border-color:#b48c5888;color:var(--maroon)}
/* ---------- forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-height:41px;outline:none;transition:border-color .18s,box-shadow .18s}
.field textarea{min-height:74px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b48c5822}
.field .err{color:var(--bad);font-size:11.5px;margin-top:5px;display:none}
.field.invalid input{border-color:var(--bad)}
.field.invalid .err{display:block}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* ---------- modal ---------- */
.modal-back{position:fixed;inset:0;z-index:60;background:#22141266;backdrop-filter:blur(3px);display:grid;place-items:center;padding:18px;animation:fade .2s ease both}
.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 24px 70px #1e0f0d59;animation:rise .28s cubic-bezier(.2,.8,.25,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-h h3{font:400 18px var(--serif);margin:0}
.modal-b{padding:20px 22px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line)}
/* ---------- toast ---------- */
.toast{position:fixed;z-index:80;left:50%;bottom:26px;transform:translateX(-50%) translateY(6px);background:#2c211f;color:#f3e9de;padding:12px 18px;border-radius:7px;font-size:13px;box-shadow:0 10px 30px #0005;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:min(480px,92vw);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:#7c2d26}
/* ============ MEASUREMENT DESIGNER ============ */
.client-top{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.client-top .avatar{width:46px;height:46px;flex:none;border-radius:50%;background:var(--maroon);color:#fff;display:grid;place-items:center;font:italic 20px var(--serif)}
[data-theme="dark"] .client-top .avatar{color:#241718}
.client-top h3{font:400 20px var(--serif);margin:0}
.client-top .phone{color:var(--muted);font-size:12.5px;margin-top:2px}
.client-top .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.designer{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;align-items:stretch}
.body-panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;padding:14px 10px 8px;min-height:480px}
.body-panel svg{width:100%;max-width:236px;height:auto;display:block}
.measure-panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.garment-tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 18px 0}
.garment-tabs button{padding:7px 13px;font-size:11px;font-weight:700;letter-spacing:.05em;background:transparent;border:1px solid var(--line);border-radius:999px;color:var(--muted);transition:all .18s}
.garment-tabs button:hover{border-color:var(--gold);color:var(--maroon)}
.garment-tabs button.active{background:var(--maroon);border-color:var(--maroon);color:#fff}
[data-theme="dark"] .garment-tabs button.active{color:#241718}
.measure-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;flex-wrap:wrap}
.unit-toggle{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.unit-toggle button{padding:6px 13px;font-size:11px;font-weight:700;background:transparent;border:0;color:var(--muted)}
.unit-toggle button.active{background:var(--maroon);color:#fff}
[data-theme="dark"] .unit-toggle button.active{color:#241718}
.updated{font-size:11px;color:var(--muted)}
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px;padding:4px 18px 10px;flex:1;align-content:start}
.m-item{position:relative}
.m-item label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-item input{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:8px 26px 8px 10px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s}
.m-item input:focus,.m-item input.hot{border-color:var(--gold);box-shadow:0 0 0 3px #b48c5833;background:var(--panel)}
.m-item .unit{position:absolute;right:9px;top:50%;transform:translateY(-42%);font-size:9.5px;color:var(--muted);pointer-events:none}
.m-item.invalid input{border-color:var(--bad)}
.m-item .range-err{display:none;font-size:10px;color:var(--bad);margin-top:3px}
.m-item.invalid .range-err{display:block}
.custom-fields{padding:2px 18px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.notes-box{padding:0 18px 12px}
.notes-box label{display:block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.notes-box textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;padding:9px 11px;min-height:56px;resize:vertical;outline:none}
.notes-box textarea:focus{border-color:var(--gold)}
.measure-foot{display:flex;align-items:center;gap:10px;padding:13px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.measure-foot .hint{font-size:11px;color:var(--muted);margin-right:auto}
/* body figure */
.body-svg .figure{fill:var(--panel-2);stroke:var(--muted);stroke-width:1.1;transition:fill .3s}
.body-svg .figure-line{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.65}
.body-svg .marker{cursor:pointer}
.body-svg .marker .dot{fill:var(--gold);stroke:var(--maroon);stroke-width:1.4;transition:r .15s,fill .15s}
.body-svg .marker .hit{fill:transparent;r:16}
.body-svg .marker .lbl{font:700 9px var(--sans);fill:var(--muted);opacity:0;transition:opacity .15s;letter-spacing:.04em}
.body-svg .marker:hover .lbl,.body-svg .marker.active .lbl{opacity:1}
.body-svg .marker.active .dot,.body-svg .marker:hover .dot{fill:var(--maroon);stroke:var(--gold)}
.body-svg .marker.active .hit{fill:#b48c5822}
[data-theme="dark"] .body-svg .marker.active .dot{fill:#e0aeb5}
/* history */
.hist-list{display:grid;gap:8px}
.hist-item{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:7px;padding:11px 14px;background:var(--panel-2);cursor:pointer;transition:border-color .18s}
.hist-item:hover{border-color:var(--gold)}
.hist-item.selected{border-color:var(--maroon);box-shadow:0 0 0 2px #632c3522}
.hist-item .when{font-weight:700;font-size:13px}
.hist-item .meta{font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmp-table td.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.cmp-table .up{color:var(--bad)}
.cmp-table .down{color:var(--ok)}
.cmp-table .same{color:var(--muted)}
/* ---------- settings ---------- */
.kv{display:grid;grid-template-columns:170px 1fr;gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding-top:2px}
.kv dd{margin:0}
/* ---------- responsive ---------- */
@media(max-width:1020px){.cards{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:70;width:250px;transform:translateX(-100%);transition:transform .25s ease;box-shadow:0 0 60px #0007}
  .sidebar.open{transform:none}
  .menu-btn{display:grid}
  .view{padding:16px}
  .designer{grid-template-columns:1fr}
  .body-panel{min-height:340px}
  .client-top .actions{margin-left:0;width:100%}
}
@media(max-width:560px){.cards{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.topbar{padding:11px 14px}.view{padding:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html,body{overflow-x:hidden}
.view,.panel,.card,.client-top,.designer{min-width:0}
.panel-b{overflow-x:auto}
.table{min-width:620px}
.btn,.icon-btn,.nav button,.garment-tabs button{touch-action:manipulation}
@media(max-width:900px){
  .topbar{padding-inline:18px}
  .sidebar{height:100dvh}
  .modal-back{padding:10px}
  .modal{max-height:calc(100dvh - 20px)}
}
@media(max-width:560px){
  .view{padding:10px}
  .topbar h2{font-size:17px}
  .card,.panel-b{padding:14px}
  .panel-h{padding:13px 14px;align-items:flex-start;flex-wrap:wrap}
  .panel-h .updated{width:100%;font-size:10px}
  .panel-h .btn{width:100%}
  .client-top{padding:14px}
  .client-top .actions .btn{flex:1}
  .hist-item{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:8px 10px}
  .hist-item .when{min-width:0;line-height:1.35;overflow-wrap:anywhere}
  .hist-item .meta{grid-column:1/-1;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;line-height:1.4}
  .hist-item [data-load]{grid-column:1/-1;width:100%;justify-content:center}
  .modal-h,.modal-b,.modal-f{padding-left:15px;padding-right:15px}
  .modal-f{flex-direction:column-reverse}
  .modal-f .btn{width:100%;justify-content:center}
  .kv{grid-template-columns:1fr;gap:3px 0}
  .kv dd{margin-bottom:8px;overflow-wrap:anywhere}
  .measure-foot .hint{width:100%;margin-right:0}
}
@media(max-width:360px){
  .topbar{gap:8px;padding-inline:10px}
  .view{padding:8px}
  .stat .v{font-size:29px}
  .m-grid,.custom-fields{padding-left:12px;padding-right:12px}
  .notes-box,.measure-foot{padding-left:12px;padding-right:12px}
}

.demo-banner{position:sticky;top:0;z-index:99;background:#8a5a1e;color:#ffe9c9;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-align:center;padding:7px 12px}
[data-theme="dark"] .demo-banner{background:#5c3f14}
</style>
</head>
<body>
<div class="demo-banner">🟠 OFFLINE DEMO — sample data, nothing is saved. Real system: live preview tab → /login.html</div>

<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Management navigation">
    <div class="sb-brand">
      <span class="mark">A</span>
      <span><strong>Adarsh Boutique</strong><small>Management System</small></span>
    </div>
    <nav class="nav" id="nav">
      <button data-route="#/dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</button>
      <button data-route="#/customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.7c2.8.2 4.9 2 5.5 5.3"/></svg>Customers</button>
      <button data-route="#/measurements"><svg viewBox="0 0 24 24"><path d="M4 20 20 4M4 16l2 2M8 12l2 2M12 8l2 2M16 4l2 2"/><path d="M3 21h18" opacity=".5"/></svg>Measurements</button>
      <button data-route="#/orders"><svg viewBox="0 0 24 24"><path d="M6 7h12l1.5 13.5a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>Orders</button>
      <button data-route="#/appointments"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 15h3"/></svg>Appointments</button>
      <button data-route="#/settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4.8a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.4a7 7 0 0 0-2 1.2l-2.4-.8-2 3.5 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-.8a7 7 0 0 0 2 1.2L10 21h4l.5-2.4a7 7 0 0 0 2-1.2l2.4.8 2-3.5-2-1.5c.06-.4.1-.8.1-1.2z"/></svg>Settings</button>
      <button id="logout-btn"><svg viewBox="0 0 24 24"><path d="M14 4h4a1.5 1.5 0 0 1 1.5 1.5v13A1.5 1.5 0 0 1 18 20h-4M10 17l-5-5 5-5M5 12h11"/></svg>Logout</button>
    </nav>
    <div class="sb-foot"><span class="who" id="who">…</span><button class="icon-btn" id="theme-btn" title="Switch theme" aria-label="Switch theme"><svg viewBox="0 0 24 24"><path d="M20 13A8 8 0 1 1 11 4a6.5 6.5 0 0 0 9 9z"/></svg></button></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
      <h2 id="page-title">Dashboard</h2>
      <button class="icon-btn" id="refresh-btn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 3v4h-4"/></svg></button>

  ];

  function currentOf(cid) {
    var h = HISTORY[cid];
    if (!h || !h.length) return null;
    var last = h[h.length - 1];
    return { client_id: cid, garment_type: last.garment_type, values: last.values, notes: last.notes, unit_used: last.unit_used, updated_at: last.saved_at };
  }
  function clientList(q) {
    var rows = CLIENTS.slice().reverse();
    if (q) { q = q.toLowerCase();
      rows = rows.filter(function (c) { return c.name.toLowerCase().indexOf(q) !== -1 || c.phone.replace(/\D/g, '').indexOf(q.replace(/\D/g, '')) !== -1; }); }
    return rows.map(function (c) { var x = Object.assign({}, c); x.current_measurement = currentOf(c.client_id); return x; });

  function route(m, path, q, b) {
    var mm;
    if (path === '/api/login' && m === 'POST') return [200, { ok: true, username: 'admin', token: 'demo', expires_at: Math.floor(Date.now() / 1000) + 28800, expires_in: 28800 }];

    if (path === '/api/me') return [200, { username: 'admin', role: 'admin', storage: 'Offline demo (in-browser)', sheets: false }];
    if (path === '/api/stats') {
      var today = new Date().toISOString().slice(0, 10), tms = 0;
      Object.keys(HISTORY).forEach(function (k) { tms += HISTORY[k].length; });
      return [200, { total_customers: CLIENTS.length, total_measurements: tms,

    }
    mm = path.match(/^\/api\/clients\/([^/]+)$/);

    if (mm && m === 'PUT') { var c2 = findC(decodeURIComponent(mm[1])); if (!c2) return [404, { error: 'Customer not found.' }];
      if (b.phone) { var d2 = null; CLIENTS.forEach(function (c) { if (c.client_id !== c2.client_id && norm(c.phone) === norm(b.phone)) d2 = c; });
        if (d2) return [409, { error: 'Another customer already uses this phone number.', existing: d2 }]; }
      Object.assign(c2, b, { updated_at: now() }); return [200, c2]; }
    if (mm && m === 'DELETE') { var cid = decodeURIComponent(mm[1]), i = -1;
      CLIENTS.forEach(function (c, ix) { if (c.client_id === cid) i = ix; });
      if (i < 0) return [404, { error: 'Customer not found.' }];
      CLIENTS.splice(i, 1); delete HISTORY[cid];
      ORDERS = ORDERS.filter(function (o) { return o.client_id !== cid; });

    mm = path.match(/^\/api\/clients\/([^/]+)\/measurements$/);
    if (mm && m === 'GET') { var cid2 = decodeURIComponent(mm[1]); return [200, { current: currentOf(cid2), history: (HISTORY[cid2] || []).slice().reverse() }]; }
    if (mm && m === 'POST') { var cid3 = decodeURIComponent(mm[1]); if (!findC(cid3)) return [404, { error: 'Customer not found.' }];

    mm = path.match(/^\/api\/clients\/([^/]+)\/orders$/);
    if (mm && m === 'GET') { var cid4 = decodeURIComponent(mm[1]); return [200, { orders: ORDERS.filter(function (o) { return o.client_id === cid4; }).slice().reverse() }]; }
    if (path === '/api/orders' && m === 'GET') return [200, { orders: ORDERS.slice().reverse() }];
    if (path === '/api/orders' && m === 'POST') {
      if (!findC(b.client_id)) return [422, { error: 'Customer not found.' }];
      var o = { order_id: mkid('O'), client_id: b.client_id, garment: b.garment, notes: b.notes || '', due_date: b.due_date || '', status: 'Pending', created_at: now(), updated_at: now() };
      ORDERS.push(o); return [201, o]; }
    mm = path.match(/^\/api\/orders\/([^/]+)$/);
    if (mm && m === 'PUT') { for (var j = 0; j < ORDERS.length; j++) if (ORDERS[j].order_id === decodeURIComponent(mm[1])) { Object.assign(ORDERS[j], b, { updated_at: now() }); return [200, ORDERS[j]]; } return [404, { error: 'Order not found.' }]; }
    if (path === '/api/appointments') return [200, { appointments: APPTS.slice().reverse() }];
    return [404, { error: 'Not found in demo: ' + m + ' ' + path }];
  }

  window.fetch = function (url, opts) {
    opts = opts || {};
    var s = String(url), path = s.split('?')[0], q = {};
    (s.split('?')[1] || '').split('&').forEach(function (kv) { var a = kv.split('='); if (a[0]) q[decodeURIComponent(a[0])] = decodeURIComponent(a[1] || ''); });
    var b = {}; try { b = opts.body ? JSON.parse(opts.body) : {}; } catch (_) {}
    var res = route((opts.method || 'GET').toUpperCase(), path, q, b);
    return Promise.resolve({ ok: res[0] < 400, status: res[0], json: function () { return Promise.resolve(JSON.parse(JSON.stringify(res[1]))); } });
  };
})();</script>
<script>
/* ============================================================
   Adarsh Boutique - Tailor Shop Management System (admin SPA)
   Vanilla JS. Talks to the Python backend with a Bearer token.
   Security: token in sessionStorage (cleared on logout/tab close),
   sent as Authorization header; every response 401 -> back to login.
   ============================================================ */
(function () {
'use strict';

var API = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || '';
var $ = function (sel, el) { return (el || document).querySelector(sel); };
var view = $('#view');
/* storage: prefer sessionStorage; embedded viewers may block it -> memory fallback */
var storage = (function () {
  try { var t = '__ab_t'; sessionStorage.setItem(t, '1'); sessionStorage.removeItem(t); return sessionStorage; }
  catch (_) { var m = {}; return { getItem: function (k) { return (k in m) ? m[k] : null; },
    setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
})();

/* ---------------- tiny helpers ---------------- */
function esc(s) {  // escape user data before innerHTML - XSS protection
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg, isErr) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = 'toast'; }, 3600);
}
function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(String(iso).replace(' ', 'T'));
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
}
function debounce(fn, ms) {
  var t; return function () { var a = arguments, self = this;
    clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); };
}

/* ---------------- auth ---------------- */
function getToken() {
  try {
    var token = storage.getItem('ab_token');
    var exp = Number(storage.getItem('ab_exp') || 0);
    if (!token || exp < Date.now() + 5000) return null;
    return token;
  } catch (_) { return null; }
}
function logout(localOnly) {
  if (!localOnly) api('POST', '/api/logout').catch(function () {});
  try { storage.removeItem('ab_token'); storage.removeItem('ab_user');
        storage.removeItem('ab_exp'); } catch (_) {}
  location.replace('login.html');
}
$('#logout-btn').addEventListener('click', function () { logout(false); });

function api(method, path, body) {
  var token = getToken();
  if (!token) { logout(true); throw new Error('signed out'); }
  return fetch(API + path, {
    method: method,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'X-Requested-With': 'fetch'
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function (r) {
    if (r.status === 401) { logout(true); throw new Error('Please sign in again.'); }
    return r.json().catch(function () { return {}; }).then(function (data) {
      if (!r.ok) {
        var err = new Error((data && data.error) || ('Request failed (' + r.status + ')'));
        err.data = data; err.status = r.status;
        throw err;
      }
      return data;
    });
  });
}

/* ---------------- theme ---------------- */
function applyTheme() {
  var saved = 'light';
  try { saved = localStorage.getItem('ab_theme') || 'light'; } catch (_) { saved = 'light'; }
  document.documentElement.setAttribute('data-theme', saved);
}
$('#theme-btn').addEventListener('click', function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('ab_theme', next); } catch (_) {}
  applyTheme();
});
applyTheme();

/* ---------------- mobile sidebar ---------------- */
$('#menu-btn').addEventListener('click', function () { $('#sidebar').classList.toggle('open'); });
document.addEventListener('click', function (e) {
  var sb = $('#sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target) && e.target.closest('#menu-btn') === null &&
      !e.target.closest('#sidebar')) sb.classList.remove('open');
});

/* ---------------- router ---------------- */
var ROUTES = {
  '#/dashboard':     { title: 'Dashboard',        render: renderDashboard },
  '#/customers':     { title: 'Customers',        render: renderCustomers },
  '#/measurements':  { title: 'Measurements',     render: renderMeasurementsIndex },
  '#/orders':        { title: 'Orders',           render: renderOrders },
  '#/appointments':  { title: 'Appointments',     render: renderAppointments },
  '#/settings':      { title: 'Settings',         render: renderSettings }
};
var currentClient = null;   // cached customer record for the client page
var lastClientQuery = '';

function route() {
  var hash = location.hash || '#/dashboard';
  $('#sidebar').classList.remove('open');
  document.querySelectorAll('#nav button[data-route]').forEach(function (b) {
    var on = hash.indexOf(b.getAttribute('data-route')) === 0;
    b.classList.toggle('active', on);
  });
  var clientMatch = hash.match(/^#\/client\/([A-Za-z0-9-]+)/);
  if (clientMatch) {
    $('#page-title').textContent = 'Customer profile';
    renderClientPage(clientMatch[1]);
    return;
  }
  var def = ROUTES[hash] || ROUTES['#/dashboard'];
  $('#page-title').textContent = def.title;
  def.render().catch(function (err) { view.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
}
window.addEventListener('hashchange', route);
document.querySelectorAll('#nav button[data-route]').forEach(function (b) {
  b.addEventListener('click', function () { location.hash = b.getAttribute('data-route'); });
});
$('#refresh-btn').addEventListener('click', route);

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  view.innerHTML = '<div class="empty">Loading dashboard…</div>';
  return api('GET', '/api/stats').then(function (s) {
    var today = todayISO();
    view.innerHTML =
      '<div class="cards">' +
        statCard('Customers', s.total_customers, 'people in your book') +
        statCard('Measurements saved', s.total_measurements, 'measurement sessions') +
        statCard("Today's appointments", s.todays_appointments, fmtDate(today).split(',')[0]) +
        statCard('Pending orders', s.pending_orders, s.pending_orders > 0 ? 'to stitch & deliver' : 'all caught up') +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-h"><h3>Recently added customers</h3>' +
          '<button class="btn ghost small" data-go="#/customers">View all →</button></div>' +
          '<div id="recent-wrap"></div></div>' +
        '<div class="panel"><div class="panel-h"><h3>Quick actions</h3></div><div class="panel-b" id="quick"></div></div>' +
      '</div>';
    var rows = (s.recent_customers || []).map(function (c) {
      return '<tr class="rowlink" data-cid="' + esc(c.client_id) + '"><td><b>' + esc(c.name) + '</b>' +
        (c.current_measurement ? '<span class="sub">Last: ' + esc(c.current_measurement.garment_type) + ' · ' + esc(fmtDate(c.current_measurement.updated_at)) + '</span>' : '<span class="sub">No measurements yet</span>') +
        '</td><td style="text-align:right;color:var(--muted)">' + esc(c.phone) + '</td></tr>';
    }).join('');
    $('#recent-wrap').innerHTML = rows
      ? '<table class="table"><tbody>' + rows + '</tbody></table>'
      : '<div class="empty">No customers yet. Add your first one!</div>';
    $('#recent-wrap').addEventListener('click', function (e) {
      var tr = e.target.closest('tr[data-cid]');
      if (tr) location.hash = '#/client/' + tr.getAttribute('data-cid');
    });
    $('#quick').innerHTML =
      '<div style="display:grid;gap:9px">' +
      '<button class="btn" id="qa-customer">＋ Add new customer</button>' +
      '<button class="btn ghost" id="qa-order">🧵 Create an order</button>' +
      '<button class="btn ghost" id="qa-appt">📅 View appointments</button>' +
      '<a class="btn ghost" href="/" target="_blank" rel="noopener">🌐 Open public website</a></div>';
    $('#qa-customer').addEventListener('click', function () { location.hash = '#/customers'; setTimeout(openAddCustomer, 250); });
    $('#qa-order').addEventListener('click', function () { location.hash = '#/orders'; setTimeout(openAddOrder, 250); });
    $('#qa-appt').addEventListener('click', function () { location.hash = '#/appointments'; });
  });
}
function statCard(k, v, s) {
  return '<div class="card stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) +
         '</div><div class="s">' + esc(s) + '</div></div>';
}

/* ============================================================
   CUSTOMERS
   ============================================================ */
function renderCustomers() {
  view.innerHTML =
    '<div class="panel"><div class="panel-h">' +
      '<input id="cust-search" placeholder="Search by name or mobile…" value="' + esc(lastClientQuery) + '" ' +
      'style="flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:10px 13px;outline:none" aria-label="Search customers">' +
      '<button class="btn" id="add-cust">＋ Add new customer</button></div>' +
      '<div id="cust-list"><div class="empty">Loading…</div></div></div>';
  $('#add-cust').addEventListener('click', openAddCustomer);
  var doSearch = debounce(function () {
    lastClientQuery = $('#cust-search').value;
    loadCustomers(lastClientQuery);
  }, 250);
  $('#cust-search').addEventListener('input', doSearch);
  return loadCustomers(lastClientQuery);
}
function loadCustomers(query) {
  var wrap = $('#cust-list');
  if (!wrap) return Promise.resolve();
  return api('GET', '/api/clients' + (query ? '?q=' + encodeURIComponent(query) : '')).then(function (data) {
    var clients = data.clients || [];
    if (!clients.length) {
      wrap.innerHTML = '<div class="empty">' + (query ? 'No customers match “' + esc(query) + '”.' :
        'No customers yet — add your first one with the button above.') + '</div>';
      return;
    }
    var rows = clients.map(function (c) {
      var m = c.current_measurement;
      return '<tr class="rowlink" data-cid="' + esc(c.client_id) + '">' +
        '<td><b>' + esc(c.name) + '</b>' + (c.email ? '<span class="sub">' + esc(c.email) + '</span>' : '') + '</td>' +
        '<td>' + esc(c.phone) + '</td>' +
        '<td>' + (m ? '<span class="badge info">' + esc(m.garment_type) + '</span>' : '<span class="badge">—</span>') + '</td>' +
        '<td style="color:var(--muted);font-size:12px">' + esc(fmtDate(m ? m.updated_at : c.created_at)) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' +
        '<button class="btn ghost small" data-edit="' + esc(c.client_id) + '">Edit</button> ' +
        '<button class="btn danger small" data-del="' + esc(c.client_id) + '" data-name="' + esc(c.name) + '">Delete</button></td></tr>';
    }).join('');
    wrap.innerHTML = '<table class="table"><thead><tr><th>Customer</th><th>Mobile</th><th>Last measurement</th><th>Updated</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    wrap.onclick = function (e) {
      var edit = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]'), row = e.target.closest('tr[data-cid]');
      if (edit) { e.stopPropagation(); openEditCustomer(edit.getAttribute('data-edit')); return; }
      if (del) { e.stopPropagation(); confirmDelete(del.getAttribute('data-del'), del.getAttribute('data-name')); return; }
      if (row) location.hash = '#/client/' + row.getAttribute('data-cid');
    };
  }).catch(function (err) { wrap.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
}

  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>' +
    '<div class="modal-b">' + bodyHTML + '</div><div class="modal-f">' + footerHTML + '</div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', function (e) { if (e.target === back || e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', escListener);
  return back;
}
function escListener(e) { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escListener); } }

function customerForm(c) {
  c = c || {};
  return '<div class="field"><label>Full name *</label><input id="cf-name" maxlength="80" value="' + esc(c.name || '') + '"><div class="err" id="cf-name-err">Please enter the customer name.</div></div>' +

function readCustomerForm() {

function validateCustomerUI(data) {
  var ok = true;
  $('#cf-name').closest('.field').classList.toggle('invalid', !data.name); if (!data.name) ok = false;
  var digits = data.phone.replace(/\D/g, '');
  var phoneOk = digits.length >= 7 && digits.length <= 15;
  $('#cf-phone').closest('.field').classList.toggle('invalid', !phoneOk); if (!phoneOk) ok = false;

function openAddCustomer() {
  var back = modal('Add new customer', customerForm(),
    '<button class="btn ghost" data-close>Cancel</button><button class="btn" id="cf-save">Save customer</button>');
  $('#cf-save', back).addEventListener('click', function () {
    var data = readCustomerForm();
    if (!validateCustomerUI(data)) return;
    $('#cf-save').disabled = true;
    api('POST', '/api/clients', data).then(function (rec) {
      closeModal(); toast('Customer "' + rec.name + '" added ✓');
      if (location.hash.indexOf('#/client/') === 0 || location.hash === '#/customers') route();
      else location.hash = '#/client/' + rec.client_id;
    }).catch(function (err) {
      $('#cf-save').disabled = false;
      if (err.status === 409 && err.data && err.data.existing) {
        if (confirm('A customer with this number already exists:\n\n' + err.data.existing.name + ' · ' + err.data.existing.phone +
          '\n\nOpen that profile instead?')) {
          closeModal(); location.hash = '#/client/' + err.data.existing.client_id;
        }
      } else toast(err.message, true);
    });
  });
  $('#cf-name', back).focus();
}
function openEditCustomer(cid) {
  api('GET', '/api/clients/' + cid).then(function (c) {
    var back = modal('Edit customer', customerForm(c),
      '<button class="btn ghost" data-close>Cancel</button><button class="btn" id="cf-save">Save changes</button>');
    $('#cf-save', back).addEventListener('click', function () {
      var data = readCustomerForm();
      if (!validateCustomerUI(data)) return;
      $('#cf-save').disabled = true;
      api('PUT', '/api/clients/' + cid, data).then(function () {
        closeModal(); toast('Customer updated ✓'); route();
      }).catch(function (err) { $('#cf-save').disabled = false; toast(err.message, true); });
    });

}
function confirmDelete(cid, name) {
  var back = modal('Delete customer?',
    '<p style="margin:0 0 8px">This permanently removes <b>' + esc(name) + '</b> along with all measurement history and orders.</p>' +
    '<p style="margin:0;color:var(--bad);font-size:12.5px">This cannot be undone. Google Sheets rows are removed too.</p>',

/* ---------- designer behaviour ---------- */
function garmentFields() { return GARMENT_FIELDS[mState.garment] || GARMENT_FIELDS.Custom; }

function toDisplay(vIn) { return mState.unit === 'cm' ? +(vIn * IN_TO_CM).toFixed(1) : +Number(vIn).toFixed(2); }
function toInches(v) { return mState.unit === 'cm' ? v / IN_TO_CM : v; }
function unitLabel() { return mState.unit; }

function renderMeasureGrid() {
  var grid = $('#m-grid');
  grid.innerHTML = garmentFields().map(function (key) {
    var def = FIELDS[key];
    var v = mState.values[key];
    return '<div class="m-item" data-f="' + key + '"><label title="' + esc(def.label) + '">' + esc(def.label) + '</label>' +
      '<input inputmode="decimal" placeholder="—"' + (v === undefined ? '' : ' value="' + esc(toDisplay(v)) + '"') +
      ' aria-label="' + esc(def.label) + ' in ' + unitLabel() + '"><span class="unit">' + unitLabel() + '</span>' +
      '<div class="range-err">Between ' + (mState.unit === 'cm' ? +(def.min * IN_TO_CM).toFixed(0) : def.min) + '–' +
      (mState.unit === 'cm' ? +(def.max * IN_TO_CM).toFixed(0) : def.max) + ' ' + unitLabel() + '</div></div>';
  }).join('');
  $('#m-updated').textContent = currentClient.current_measurement && currentClient.current_measurement.updated_at
    ? 'Last saved ' + fmtDate(currentClient.current_measurement.updated_at) : 'No measurements saved yet';
  var cf = $('#custom-fields');
  cf.innerHTML = mState.custom.map(function (f, i) {
    var shown = (f.value === '' || f.value === undefined || f.value === null) ? '' : toDisplay(f.value);
    return '<div class="m-item" data-custom="' + i + '"><label>' + esc(f.name) + ' (custom)</label>' +
      '<input inputmode="decimal" placeholder="—" value="' + esc(shown) + '"' +
      ' data-custom-input="' + i + '"><span class="unit">' + unitLabel() + '</span></div>';
  }).join('') +
    '<div class="m-item"><label>Add custom field</label>' +
    '<div style="display:flex;gap:6px"><input id="cf-new-name" placeholder="Name" style="min-width:0"><button class="btn ghost small" id="cf-add" style="flex:none">＋</button></div></div>';
  bindFieldEvents();
}

function bindDesigner() {
  renderMeasureGrid();
  $('#garment-tabs').addEventListener('click', function (e) {
    var b = e.target.closest('[data-g]');
    if (!b) return;
    mState.garment = b.getAttribute('data-g');
    document.querySelectorAll('#garment-tabs button').forEach(function (x) {
      var on = x === b; x.classList.toggle('active', on); x.setAttribute('aria-selected', on);
    });
    renderMeasureGrid();
  });
  $('#unit-toggle').addEventListener('click', function (e) {
    var b = e.target.closest('[data-u]');
    if (!b || b.classList.contains('active')) return;
    collectFormValues();              // canonical inches
    mState.unit = b.getAttribute('data-u');
    document.querySelectorAll('#unit-toggle button').forEach(function (x) { x.classList.toggle('active', x === b); });
    renderMeasureGrid();
  });
  $('#m-notes').addEventListener('input', function () { mState.notes = this.value; });
  $('#m-save').addEventListener('click', saveMeasurements);
  $('#body-panel').addEventListener('click', function (e) {
    var mk = e.target.closest('.marker');
    if (!mk) return;
    activateMarker(mk.getAttribute('data-mk'));
    var input = document.querySelector('.m-item[data-f="' + mk.getAttribute('data-mk') + '"] input');
    if (input) { input.scrollIntoView({ block: 'center', behavior: 'smooth' }); input.focus({ preventScroll: true }); }
  });
}

function bindFieldEvents() {
  document.querySelectorAll('#m-grid .m-item').forEach(function (item) {
    var key = item.getAttribute('data-f');
    var input = item.querySelector('input');
    input.addEventListener('focus', function () { activateMarker(key); });
    input.addEventListener('blur', function () { deactivateMarker(key); validateFieldInput(key, input); });
    input.addEventListener('input', function () { item.classList.remove('invalid'); });
  });
  document.querySelectorAll('[data-custom-input]').forEach(function (input) {
    input.addEventListener('focus', function () { input.closest('.m-item').classList.add('hot'); });
    input.addEventListener('blur', function () { input.closest('.m-item').classList.remove('hot'); });
    input.addEventListener('input', function () {
      var i = Number(input.getAttribute('data-custom-input'));
      var parsed = parseFloat(input.value);
      mState.custom[i].value = isNaN(parsed) ? '' : parsed;
    });
  });
  var add = $('#cf-add'); if (add) add.addEventListener('click', addCustomField);
  var nn = $('#cf-new-name');
  if (nn) nn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addCustomField(); } });
}
function addCustomField() {
  var input = $('#cf-new-name');
  var name = (input.value || '').trim();
  if (!name) { input.focus(); return; }
  if (FIELDS[name.toLowerCase().replace(/\s+/g, '')]) { toast('That is already a standard field.', true); return; }
  if (mState.custom.length >= 10) { toast('Up to 10 custom fields.', true); return; }
  mState.custom.push({ name: name.slice(0, 40), value: '' });
  renderMeasureGrid();
  var last = document.querySelector('[data-custom-input="' + (mState.custom.length - 1) + '"]');
  if (last) last.focus();
}
function validateFieldInput(key, input) {
  var item = input.closest('.m-item');
  var raw = parseFloat(input.value);
  if (input.value.trim() === '') { item.classList.remove('invalid'); return; }
  var def = FIELDS[key];
  var inches = toInches(raw);
  var ok = !isNaN(inches) && inches >= def.min - 0.01 && inches <= def.max + 0.01;
  item.classList.toggle('invalid', !ok);
}
function activateMarker(key) {
  document.querySelectorAll('.marker.active').forEach(function (x) { x.classList.remove('active'); });
  var mk = document.querySelector('.marker[data-mk="' + key + '"]');
  if (mk) mk.classList.add('active');
}
function deactivateMarker(key) {
  var mk = document.querySelector('.marker[data-mk="' + key + '"]');
  if (mk) mk.classList.remove('active');
}

function collectFormValues() {
  /* Read all inputs into canonical inches; returns {ok, message}. */
  var values = {};
  var ok = true;
  document.querySelectorAll('#m-grid .m-item').forEach(function (item) {
    var key = item.getAttribute('data-f');
    var input = item.querySelector('input');
    var raw = parseFloat(input.value);
    if (input.value.trim() === '') return;
    var inches = toInches(raw);
    var def = FIELDS[key];
    if (isNaN(inches) || inches < def.min - 0.01 || inches > def.max + 0.01) {
      item.classList.add('invalid'); ok = false; return;
    }
    values[key] = +inches.toFixed(2);
  });
  mState.custom.forEach(function (f, i) {
    var input = document.querySelector('[data-custom-input="' + i + '"]');
    if (!input) return;
    var raw = parseFloat(input.value);
    if (input.value.trim() === '' || isNaN(raw)) return;
    var inches = toInches(raw);
    if (!(inches >= 0.2 && inches <= 400)) { item.closest('.m-item').classList.add('invalid'); ok = false; return; }
    values[f.name] = +inches.toFixed(2);
  });
  if (!ok) return { ok: false, message: 'Please fix the highlighted measurement values.' };
  if (Object.keys(values).length === 0) return { ok: false, message: 'Enter at least one measurement before saving.' };
  mState.values = values;
  mState.notes = $('#m-notes').value.trim();
  return { ok: true };
}

function saveMeasurements() {
  var check = collectFormValues();
  if (!check.ok) { toast(check.message, true); return; }
  var btn = $('#m-save');
  btn.disabled = true; btn.textContent = 'Saving…';
  api('POST', '/api/clients/' + encodeURIComponent(currentClient.client_id) + '/measurements', {
    garment_type: mState.garment,
    values: mState.values,
    notes: mState.notes,
    unit_used: mState.unit
  }).then(function () {
    toast('Measurements saved ✓ — previous session kept in history');
    renderClientPageRefresh();
  }).catch(function (err) {
    btn.disabled = false; btn.textContent = '💾 Save measurements';
    toast(err.message, true);

}
function renderClientPageRefresh() {
  if (location.hash.indexOf('#/client/') === 0) {

}

/* ---------- history panel + compare ---------- */
function renderHistoryPanel() {
  var panel = $('#history-panel');
  if (!panel) return;
  var hist = mState.history;
  var options = hist.map(function (h) { return '<option value="' + esc(h.id) + '">' + esc(fmtDate(h.saved_at)) + ' · ' + esc(h.garment_type) + '</option>'; }).join('');
  panel.innerHTML =
    '<div class="panel-h"><h3>Measurement history</h3>' +
      '<span class="updated">' + hist.length + ' session' + (hist.length === 1 ? '' : 's') + ' · nothing is ever overwritten</span></div>' +
    '<div class="panel-b">';
  if (!hist.length) {
    panel.innerHTML += '<div class="empty">No sessions yet — save the first measurement above.</div></div>';
    return;
  }
  panel.innerHTML +=
    '<div class="hist-list">' + hist.map(function (h, i) {
      var keys = Object.keys(h.values || {}).slice(0, 6).map(function (k) { return '<b>' + esc(k) + '</b> ' + h.values[k] + '″'; }).join(' · ');
      return '<div class="hist-item" data-hs="' + esc(h.id) + '">' +
        '<span class="badge info">' + esc(h.garment_type) + '</span>' +
        '<span class="when">' + esc(fmtDate(h.saved_at)) + '</span>' +
        '<span class="meta">' + keys + (h.notes ? ' · <i>' + esc(h.notes) + '</i>' : '') + '</span>' +

    }).join('') + '</div>' +
    (hist.length >= 1 ?
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
      '<h4 style="font:400 14px var(--serif);margin:0 0 10px">Compare sessions</h4>' +
      '<div class="form-row" style="grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px">' +
      '<div class="field" style="margin:0"><label>Old session</label><select id="cmp-a"><option value="">— choose —</option>' + options + '</select></div>' +
      '<div class="field" style="margin:0"><label>New</label><select id="cmp-b"><option value="">Current form</option>' + options + '</select></div>' +
      '<button class="btn ghost" id="cmp-go">Compare →</button></div><div id="cmp-out" style="margin-top:12px"></div></div>' : '') +
    '</div>';
  panel.addEventListener('click', function (e) {
    var load = e.target.closest('[data-load]');
    if (load) { loadSession(load.getAttribute('data-load')); return; }
    var item = e.target.closest('.hist-item');
    if (item && !e.target.closest('button')) loadSession(item.getAttribute('data-hs'));
  });
  var go = $('#cmp-go');
  if (go) go.addEventListener('click', compareSessions);
}
function findSession(id) {
  return mState.history.filter(function (h) { return h.id === id; })[0] || null;
}
function loadSession(id) {
  var h = findSession(id);
  if (!h) return;
  mState.garment = h.garment_type;
  mState.values = Object.assign({}, h.values);
  mState.notes = h.notes || '';
  mState.unit = h.unit_used || 'in';
  mState.custom = Object.keys(h.values || {}).filter(function (k) { return !FIELDS[k]; })
    .map(function (k) { return { name: k, value: h.values[k] }; });
  /* refresh tabs + unit toggle + grid */
  document.querySelectorAll('#garment-tabs button').forEach(function (x) {
    var on = x.getAttribute('data-g') === mState.garment;
    x.classList.toggle('active', on); x.setAttribute('aria-selected', on);
  });
  document.querySelectorAll('#unit-toggle button').forEach(function (x) { x.classList.toggle('active', x.getAttribute('data-u') === mState.unit); });
  $('#m-notes').value = mState.notes;
  renderMeasureGrid();
  toast('Loaded session from ' + fmtDate(h.saved_at) + ' — adjust and save to create a new session');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function compareSessions() {
  var aId = $('#cmp-a').value, bId = $('#cmp-b').value;
  if (!aId && !bId) { toast('Pick at least one session to compare.', true); return; }
  collectFormValues();
  var a = aId ? findSession(aId) : null;
  var b = bId ? findSession(bId) : { values: mState.values, label: 'Current form' };
  var aVals = a ? a.values : {}, bVals = b ? b.values : {};
  var keys = {};
  Object.keys(aVals).forEach(function (k) { keys[k] = 1; });
  Object.keys(bVals).forEach(function (k) { keys[k] = 1; });
  var rows = Object.keys(keys).sort().map(function (k) {
    var av = aVals[k], bv = bVals[k];
    var cls = '', delta = '';
    if (av !== undefined && bv !== undefined) {
      var d = +(bv - av).toFixed(2);
      delta = (d > 0 ? '+ ' : d < 0 ? '− ' : '') + Math.abs(d) + '″';
      cls = d > 0 ? 'up' : d < 0 ? 'down' : 'same';
      if (Math.abs(d) > 2) cls += ''; 
    } else if (av !== undefined) { delta = 'removed'; cls = 'same'; }
    else { delta = 'new'; cls = 'same'; }
    return '<tr><td><b>' + esc(FIELDS[k] ? FIELDS[k].label : k) + '</b></td>' +
      '<td class="num">' + (av === undefined ? '—' : av + '″') + '</td>' +
      '<td class="num">' + (bv === undefined ? '—' : bv + '″') + '</td>' +
      '<td class="num ' + cls + '">' + esc(delta) + '</td></tr>';
  }).join('');
  $('#cmp-out').innerHTML = '<table class="table cmp-table"><thead><tr><th>Measurement</th><th>Old' +
    (a ? ' · ' + esc(fmtDate(a.saved_at)) : '') + '</th><th>New' + (bId ? '' : ' (form)') + '</th><th>Change</th></tr></thead><tbody>' +
    rows + '</tbody></table>';
}

/* ---------- client orders ---------- */
function loadClientOrders() {

/* ============================================================
   ORDERS

function ordersTable(orders) {

        ['Pending', 'In Progress', 'Ready', 'Delivered', 'Cancelled'].map(function (s) {

function bindOrderTable(scope) {

}
function renderOrders() {
  view.innerHTML = '<div class="panel"><div class="panel-h"><h3>Orders</h3>' +
    '<button class="btn" id="add-order">＋ New order</button></div>' +

function openAddOrder(clientId, clientName) {

      '<div class="field"><label>Due date</label><input id="of-due" type="date" min="' + todayISO() + '"></div></div>' +
      '<div class="field"><label>Notes</label><textarea id="of-notes" maxlength="500" placeholder="Design, fabric, special instructions…"></textarea></div>',

/* ============================================================
   APPOINTMENTS

   SETTINGS

function renderSettings() {

/* ============================================================
   BOOT
   ============================================================ */
if (!getToken()) { location.replace('login.html'); }
else {
  $('#who').textContent = storage.getItem('ab_user') || 'admin';
  route();
  /* keep an eye on expiry: bounce to login the moment the token ages out */
  setInterval(function () { if (!getToken()) logout(true); }, 30000);
}
})();

<script>
/* ============================================================
   Adarsh Boutique - Tailor Shop Management System (admin SPA)
   Vanilla JS. Talks to the Python backend with a Bearer token.
   Security: token in sessionStorage (cleared on logout/tab close),
   sent as Authorization header; every response 401 -> back to login.
   ============================================================ */
(function () {
'use strict';

var API = (window.APP_CONFIG && window.APP_CONFIG.apiBase) || '';
var $ = function (sel, el) { return (el || document).querySelector(sel); };
var view = $('#view');
/* storage: prefer sessionStorage; embedded viewers may block it -> memory fallback */
var storage = (function () {
  try { var t = '__ab_t'; sessionStorage.setItem(t, '1'); sessionStorage.removeItem(t); return sessionStorage; }
  catch (_) { var m = {}; return { getItem: function (k) { return (k in m) ? m[k] : null; },
    setItem: function (k, v) { m[k] = String(v); }, removeItem: function (k) { delete m[k]; } }; }
})();

/* ---------------- tiny helpers ---------------- */
function esc(s) {  // escape user data before innerHTML - XSS protection
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function toast(msg, isErr) {
  var t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.className = 'toast'; }, 3600);
}
function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(String(iso).replace(' ', 'T'));
  if (isNaN(d)) return String(iso);
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function initials(name) {
  return String(name || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join('').toUpperCase();
}
function debounce(fn, ms) {
  var t; return function () { var a = arguments, self = this;
    clearTimeout(t); t = setTimeout(function () { fn.apply(self, a); }, ms); };
}

/* ---------------- auth ---------------- */
function getToken() {
  try {
    var token = storage.getItem('ab_token');
    var exp = Number(storage.getItem('ab_exp') || 0);
    if (!token || exp < Date.now() + 5000) return null;
    return token;
  } catch (_) { return null; }
}
function logout(localOnly) {
  if (!localOnly) api('POST', '/api/logout').catch(function () {});
  try { storage.removeItem('ab_token'); storage.removeItem('ab_user');
        storage.removeItem('ab_exp'); } catch (_) {}
  location.replace('login.html');
}
$('#logout-btn').addEventListener('click', function () { logout(false); });

function api(method, path, body) {
  var token = getToken();
  if (!token) { logout(true); throw new Error('signed out'); }
  return fetch(API + path, {
    method: method,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Content-Type': 'application/json',
      'X-Requested-With': 'fetch'
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  }).then(function (r) {
    if (r.status === 401) { logout(true); throw new Error('Please sign in again.'); }
    return r.json().catch(function () { return {}; }).then(function (data) {
      if (!r.ok) {
        var err = new Error((data && data.error) || ('Request failed (' + r.status + ')'));
        err.data = data; err.status = r.status;
        throw err;
      }
      return data;
    });
  });
}

/* ---------------- theme ---------------- */
function applyTheme() {
  var saved = 'light';
  try { saved = localStorage.getItem('ab_theme') || 'light'; } catch (_) { saved = 'light'; }
  document.documentElement.setAttribute('data-theme', saved);
}
$('#theme-btn').addEventListener('click', function () {
  var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('ab_theme', next); } catch (_) {}
  applyTheme();
});
applyTheme();

/* ---------------- mobile sidebar ---------------- */
$('#menu-btn').addEventListener('click', function () { $('#sidebar').classList.toggle('open'); });
document.addEventListener('click', function (e) {
  var sb = $('#sidebar');
  if (sb.classList.contains('open') && !sb.contains(e.target) && e.target.closest('#menu-btn') === null &&
      !e.target.closest('#sidebar')) sb.classList.remove('open');
});

/* ---------------- router ---------------- */
var ROUTES = {
  '#/dashboard':     { title: 'Dashboard',        render: renderDashboard },
  '#/customers':     { title: 'Customers',        render: renderCustomers },
  '#/measurements':  { title: 'Measurements',     render: renderMeasurementsIndex },
  '#/orders':        { title: 'Orders',           render: renderOrders },
  '#/appointments':  { title: 'Appointments',     render: renderAppointments },
  '#/settings':      { title: 'Settings',         render: renderSettings }
};
var currentClient = null;   // cached customer record for the client page
var lastClientQuery = '';

function route() {
  var hash = location.hash || '#/dashboard';
  $('#sidebar').classList.remove('open');
  document.querySelectorAll('#nav button[data-route]').forEach(function (b) {
    var on = hash.indexOf(b.getAttribute('data-route')) === 0;
    b.classList.toggle('active', on);
  });
  var clientMatch = hash.match(/^#\/client\/([A-Za-z0-9-]+)/);
  if (clientMatch) {
    $('#page-title').textContent = 'Customer profile';
    renderClientPage(clientMatch[1]);
    return;
  }
  var def = ROUTES[hash] || ROUTES['#/dashboard'];
  $('#page-title').textContent = def.title;
  def.render().catch(function (err) { view.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
}
window.addEventListener('hashchange', route);
document.querySelectorAll('#nav button[data-route]').forEach(function (b) {
  b.addEventListener('click', function () { location.hash = b.getAttribute('data-route'); });
});
$('#refresh-btn').addEventListener('click', route);

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard() {
  view.innerHTML = '<div class="empty">Loading dashboard…</div>';
  return api('GET', '/api/stats').then(function (s) {
    var today = todayISO();
    view.innerHTML =
      '<div class="cards">' +
        statCard('Customers', s.total_customers, 'people in your book') +
        statCard('Measurements saved', s.total_measurements, 'measurement sessions') +
        statCard("Today's appointments", s.todays_appointments, fmtDate(today).split(',')[0]) +
        statCard('Pending orders', s.pending_orders, s.pending_orders > 0 ? 'to stitch & deliver' : 'all caught up') +
      '</div>' +
      '<div class="grid-2">' +
        '<div class="panel"><div class="panel-h"><h3>Recently added customers</h3>' +
          '<button class="btn ghost small" data-go="#/customers">View all →</button></div>' +
          '<div id="recent-wrap"></div></div>' +
        '<div class="panel"><div class="panel-h"><h3>Quick actions</h3></div><div class="panel-b" id="quick"></div></div>' +
      '</div>';
    var rows = (s.recent_customers || []).map(function (c) {

function renderCustomers() {

      '<input id="cust-search" placeholder="Search by name or mobile…" value="' + esc(lastClientQuery) + '" ' +

      '<div id="cust-list"><div class="empty">Loading…</div></div></div>';

    loadCustomers(lastClientQuery);
  }, 250);
  $('#cust-search').addEventListener('input', doSearch);
  return loadCustomers(lastClientQuery);

function loadCustomers(query) {
  var wrap = $('#cust-list');
  if (!wrap) return Promise.resolve();
  return api('GET', '/api/clients' + (query ? '?q=' + encodeURIComponent(query) : '')).then(function (data) {
    var clients = data.clients || [];
    if (!clients.length) {
      wrap.innerHTML = '<div class="empty">' + (query ? 'No customers match “' + esc(query) + '”.' :
        'No customers yet — add your first one with the button above.') + '</div>';
      return;
    }
    var rows = clients.map(function (c) {
      var m = c.current_measurement;
      return '<tr class="rowlink" data-cid="' + esc(c.client_id) + '">' +
        '<td><b>' + esc(c.name) + '</b>' + (c.email ? '<span class="sub">' + esc(c.email) + '</span>' : '') + '</td>' +
        '<td>' + esc(c.phone) + '</td>' +
        '<td>' + (m ? '<span class="badge info">' + esc(m.garment_type) + '</span>' : '<span class="badge">—</span>') + '</td>' +
        '<td style="color:var(--muted);font-size:12px">' + esc(fmtDate(m ? m.updated_at : c.created_at)) + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' +
        '<button class="btn ghost small" data-edit="' + esc(c.client_id) + '">Edit</button> ' +
        '<button class="btn danger small" data-del="' + esc(c.client_id) + '" data-name="' + esc(c.name) + '">Delete</button></td></tr>';
    }).join('');
    wrap.innerHTML = '<table class="table"><thead><tr><th>Customer</th><th>Mobile</th><th>Last measurement</th><th>Updated</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>';
    wrap.onclick = function (e) {
      var edit = e.target.closest('[data-edit]'), del = e.target.closest('[data-del]'), row = e.target.closest('tr[data-cid]');
      if (edit) { e.stopPropagation(); openEditCustomer(edit.getAttribute('data-edit')); return; }
      if (del) { e.stopPropagation(); confirmDelete(del.getAttribute('data-del'), del.getAttribute('data-name')); return; }
      if (row) location.hash = '#/client/' + row.getAttribute('data-cid');
    };
  }).catch(function (err) { wrap.innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; });
}

/* -------- add / edit / delete modals -------- */
function closeModal() { var m = $('.modal-back'); if (m) m.remove(); }
function modal(title, bodyHTML, footerHTML) {
  closeModal();
  var back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
    '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="icon-btn" data-close aria-label="Close">✕</button></div>' +
    '<div class="modal-b">' + bodyHTML + '</div><div class="modal-f">' + footerHTML + '</div></div>';
  document.body.appendChild(back);
  back.addEventListener('click', function (e) { if (e.target === back || e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', escListener);
  return back;
}
function escListener(e) { if (e.key === 'Escape') { closeModal(); document.removeEventListener('keydown', escListener); } }

function customerForm(c) {
  c = c || {};
  return '<div class="field"><label>Full name *</label><input id="cf-name" maxlength="80" value="' + esc(c.name || '') + '"><div class="err" id="cf-name-err">Please enter the customer name.</div></div>' +
    '<div class="form-row"><div class="field"><label>Mobile number *</label><input id="cf-phone" maxlength="18" inputmode="tel" value="' + esc(c.phone || '') + '" placeholder="e.g. 98765 43210"><div class="err" id="cf-phone-err">Enter a valid mobile number.</div></div>' +
    '<div class="field"><label>Email (optional)</label><input id="cf-email" maxlength="120" value="' + esc(c.email || '') + '"></div></div>' +
    '<div class="field"><label>Address (optional)</label><textarea id="cf-address" maxlength="300">' + esc(c.address || '') + '</textarea></div>';
}
function readCustomerForm() {
  return {
    name: $('#cf-name').value.trim(),
    phone: $('#cf-phone').value.trim(),
    email: $('#cf-email').value.trim(),
    address: $('#cf-address').value.trim()
  };
}
function validateCustomerUI(data) {
  var ok = true;
  $('#cf-name').closest('.field').classList.toggle('invalid', !data.name); if (!data.name) ok = false;
  var digits = data.phone.replace(/\D/g, '');
  var phoneOk = digits.length >= 7 && digits.length <= 15;
  $('#cf-phone').closest('.field').classList.toggle('invalid', !phoneOk); if (!phoneOk) ok = false;
  return ok;
}
function openAddCustomer() {
  var back = modal('Add new customer', customerForm(),
    '<button class="btn ghost" data-close>Cancel</button><button class="btn" id="cf-save">Save customer</button>');
  $('#cf-save', back).addEventListener('click', function () {
    var data = readCustomerForm();
    if (!validateCustomerUI(data)) return;
    $('#cf-save').disabled = true;
    api('POST', '/api/clients', data).then(function (rec) {
      closeModal(); toast('Customer "' + rec.name + '" added ✓');
      if (location.hash.indexOf('#/client/') === 0 || location.hash === '#/customers') route();
      else location.hash = '#/client/' + rec.client_id;
    }).catch(function (err) {
      $('#cf-save').disabled = false;
      if (err.status === 409 && err.data && err.data.existing) {
        if (confirm('A customer with this number already exists:\n\n' + err.data.existing.name + ' · ' + err.data.existing.phone +
          '\n\nOpen that profile instead?')) {
          closeModal(); location.hash = '#/client/' + err.data.existing.client_id;
        }
      } else toast(err.message, true);
    });
  });
  $('#cf-name', back).focus();
}
function openEditCustomer(cid) {
  api('GET', '/api/clients/' + cid).then(function (c) {
    var back = modal('Edit customer', customerForm(c),
      '<button class="btn ghost" data-close>Cancel</button><button class="btn" id="cf-save">Save changes</button>');
    $('#cf-save', back).addEventListener('click', function () {
      var data = readCustomerForm();
      if (!validateCustomerUI(data)) return;
      $('#cf-save').disabled = true;
      api('PUT', '/api/clients/' + cid, data).then(function () {
        closeModal(); toast('Customer updated ✓'); route();
      }).catch(function (err) { $('#cf-save').disabled = false; toast(err.message, true); });
    });
  }).catch(function (err) { toast(err.message, true); });
}
function confirmDelete(cid, name) {
  var back = modal('Delete customer?',
    '<p style="margin:0 0 8px">This permanently removes <b>' + esc(name) + '</b> along with all measurement history and orders.</p>' +
    '<p style="margin:0;color:var(--bad);font-size:12.5px">This cannot be undone. Google Sheets rows are removed too.</p>',
    '<button class="btn ghost" data-close>Keep customer</button><button class="btn danger" id="del-go">Delete permanently</button>');
  $('#del-go', back).addEventListener('click', function () {
    api('DELETE', '/api/clients/' + cid).then(function () {
      closeModal(); toast('Customer deleted');
      if (location.hash.indexOf('#/client/') !== -1) location.hash = '#/customers'; else route();
    }).catch(function (err) { toast(err.message, true); });
  });
}

  if (data.current && data.current.values) {
